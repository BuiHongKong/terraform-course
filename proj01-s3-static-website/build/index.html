<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A static website hosted on AWS S3 using Terraform"
    />
    <meta
      name="keywords"
      content="terraform, s3, aws, hashicorp, infrastructure as code"
    />
    <title>My Static S3 Website</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        line-height: 1.6;
        color: #333;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 3rem;
        max-width: 600px;
        width: 100%;
        text-align: center;
        animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        color: #667eea;
        margin-bottom: 1rem;
        font-size: 2.5rem;
        font-weight: 700;
      }

      p {
        color: #666;
        margin-bottom: 2rem;
        font-size: 1.1rem;
      }

      .badge {
        display: inline-block;
        background: #f0f0f0;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-size: 0.9rem;
        margin: 0.25rem;
        color: #555;
      }

      .badge.terraform {
        background: #7b42bc;
        color: white;
      }

      .badge.aws {
        background: #ff9900;
        color: white;
      }

      .badge.s3 {
        background: #569a31;
        color: white;
      }

      .footer {
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid #eee;
        font-size: 0.9rem;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚀 Welcome!</h1>
      <p>This is a static website hosted on AWS S3, deployed using Terraform.</p>
      <div>
        <span class="badge terraform">Terraform</span>
        <span class="badge aws">AWS</span>
        <span class="badge s3">S3</span>
      </div>
      <div class="footer">
        <p>Infrastructure as Code in action ✨</p>
      </div>
    </div>
  </body>
</html>
