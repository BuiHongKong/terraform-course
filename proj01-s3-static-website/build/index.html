<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A static website hosted on AWS S3 using Terraform"
    />
    <meta
      name="keywords"
      content="terraform, s3, aws, hashicorp, infrastructure as code"
    />
    <title>My Static S3 Website</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        line-height: 1.6;
        color: #333;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 3.5rem 3rem;
        max-width: 600px;
        width: 100%;
        text-align: center;
        animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .emoji {
        font-size: 4.5rem;
        margin-bottom: 1.5rem;
        line-height: 1;
      }

      h1 {
        color: #333;
        margin-bottom: 1rem;
        font-size: 2rem;
        font-weight: 700;
        line-height: 1.2;
      }

      p {
        color: #666;
        margin-bottom: 2.5rem;
        font-size: 1.1rem;
        line-height: 1.6;
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
      }

      .badges-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 0.5rem;
      }

      .badge {
        display: inline-block;
        background: #f5576c;
        color: white;
        padding: 0.875rem 1.75rem;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        transition: transform 0.2s, box-shadow 0.2s;
        white-space: nowrap;
      }

      .badge:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
      }

      .badge.terraform {
        background: #7b42bc;
      }

      .badge.terraform:hover {
        box-shadow: 0 10px 20px rgba(123, 66, 188, 0.3);
      }

      .badge.aws {
        background: #ff9900;
      }

      .badge.aws:hover {
        box-shadow: 0 10px 20px rgba(255, 153, 0, 0.3);
      }

      .badge.s3 {
        background: #569a31;
      }

      .badge.s3:hover {
        box-shadow: 0 10px 20px rgba(86, 154, 49, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="emoji">🚀</div>
      <h1>Welcome!</h1>
      <p>This is a static website hosted on AWS S3, deployed using Terraform.</p>
      <div class="badges-container">
        <span class="badge terraform">Terraform</span>
        <span class="badge aws">AWS</span>
        <span class="badge s3">S3</span>
      </div>
    </div>
  </body>
</html>
